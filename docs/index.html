<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INGLES — curso de Dosa</title>
<meta name="description" content="Curso personal de inglés desde cero: lecciones, audio, pronunciación, repaso espaciado y ensayos corregidos.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- Intro: se quita sola al terminar (o al primer toque). El primer toque
     ademas desbloquea el audio del navegador. -->
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-anillos"><span></span><span></span><span></span><span></span><span></span></div>
  <img class="intro-logo" src="logo.svg" alt="" width="682" height="455">
  <p class="intro-nombre">Inglés desde cero</p>
</div>


<header class="barra">
  <div class="marca" id="ir-inicio" role="button" tabindex="0">
    <img class="marca-en" src="logo.svg" alt="Inglés desde cero" width="682" height="455">
    <span class="marca-texto">Inglés desde cero</span>
  </div>
  <div class="barra-datos">
    <span class="dato" id="dato-racha" title="Días seguidos practicando"></span>
    <span class="dato" id="dato-xp" title="Experiencia total"></span>
    <button class="btn-menu" id="btn-menu" title="Menú" aria-label="Menú" aria-expanded="false"><i></i><i></i><i></i></button>
  </div>
</header>

<main id="vista"></main>

<nav class="tabs" id="tabs">
  <button data-vista="inicio" class="activo">Curso</button>
  <button data-vista="repaso">Repaso</button>
  <button data-vista="charla">Conversar</button>
  <button data-vista="perfil">Progreso</button>
</nav>

<div id="capa-modal" class="oculto"></div>

<script src="datos.js"></script>
<script src="data/u01.js"></script>
<script src="data/u02.js"></script>
<script src="data/u03.js"></script>
<script src="data/u04.js"></script>
<script src="data/u05.js"></script>
<script src="data/u06.js"></script>
<script src="data/u07.js"></script>
<script src="data/u08.js"></script>
<script src="data/u09.js"></script>
<script src="data/u10.js"></script>
<script src="data/u11.js"></script>
<script src="data/u12.js"></script>
<script src="audio/manifest.js"></script>
<script src="img/manifest.js"></script>
<script src="voz.js"></script>
<script src="app.js"></script>
<script src="lecciones.js"></script>
<script src="perfil.js"></script>
</body>
</html>
