name = "ingles"
main = "worker.js"
compatibility_date = "2026-08-01"

# Quien puede llamar al worker. El sitio vive en Cloudflare Pages (proyecto
# `verby`); verby.cloud entra en cuanto propaguen los nameservers. El de
# GitHub Pages sigue mientras tanto para no dejar a nadie fuera.
[vars]
ORIGENES = "https://verby.cloud,https://www.verby.cloud,https://verby-cgv.pages.dev,https://dosaaka2a.github.io,http://localhost:8080,http://127.0.0.1:8080"

# Cuentas, licencias, pedidos, progreso y contadores de limite.
[[d1_databases]]
binding = "DB"
database_name = "ingles"
database_id = "919f1c9d-4ee8-47c3-aab4-54888aa7cbfc"

# Progreso del curso anterior al multiusuario (una sola clave, 'progreso').
# Se mantiene solo para migrar; el progreso nuevo vive en D1, porque el plan
# gratis de KV son 1000 escrituras al dia y la sincronizacion las quema.
[[kv_namespaces]]
binding = "INGLES_KV"
id = "1ca607ab162949d2b3df4190ec618805"

# Voz neuronal de Cloudflare (Workers AI) para el texto dinamico del curso.
[ai]
binding = "AI"

# Limpieza diaria: codigos caducados, sesiones muertas y cubos de limite.
[triggers]
crons = ["17 4 * * *"]
